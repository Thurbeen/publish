name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # The suite runs the verification recipes out of the documentation, so jq
      # is a test dependency rather than a convenience.
      - run: jq --version
      - run: npm test

  # The one check main requires from this workflow, so renaming or extending the
  # matrix never changes what is required. It needs every other job here, and
  # tests/ci.test.mjs fails if one is left out. Nothing in this workflow is
  # conditional, so a skipped job is treated as a failed one rather than as a
  # pass nobody ran.
  all-checks:
    name: All Checks
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
