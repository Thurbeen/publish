<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1150" width="860" height="1150" role="img" aria-labelledby="title desc">
  <title id="title">The publish workflow, phase by phase</title>
  <desc id="desc">Phases 0 to 10 run top to bottom in four stages. Prepare: precedence, preflight and rebase. Verify: review, gate, documentation and commit. Ship: push, change request, CI, and an infrastructure plan review only when infrastructure is affected. Settle: feedback. Then the report gives the verdict at the checked head: passed only when every step passed or was not applicable, otherwise blocked. Review findings, a failing gate step, red CI and feedback fixes all go back to review along one blue loop on the left; changed documentation re-runs the gate. A panel on the right groups the early exits. Hand over: another publish skill, gate tool or agent rule owns publishing. Stop: the base branch, a dirty tree, no forge adapter or no forge login, or a rebase conflict. Block: a fifth review round still finding defects, a required gate step that cannot run, a frontend change without visual evidence or a disclosure, CI still running past its timeout, missing, partial or stale plan evidence, and a feedback point still raised after two rounds or new findings on a third pass. A token travels the path and dashes run along the loop; both stop when reduced motion is preferred.</desc>

  <style>
    .bg { fill: #ffffff; stroke: #d1d9e0; }
    .stage { fill: #f6f8fa; stroke: #e1e6eb; }
    .stage-key { fill: #f0f7ff; stroke: #b6e3ff; }
    .card { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.25; }
    .card-key { fill: #ffffff; stroke: #0969da; stroke-width: 2; }
    .card-infra { fill: #fbf7ff; stroke: #8250df; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .exits { fill: #ffffff; stroke: #d1d9e0; }
    .pill { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.25; }
    .pass { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.25; }
    .fail { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.25; }
    .chip { fill: #e7ecf0; }
    .chip-key { fill: #0969da; }
    .chip-infra { fill: none; stroke: #8250df; stroke-width: 1.25; stroke-dasharray: 3 2; }
    .spine { fill: none; stroke: #c8d1da; stroke-width: 2; }
    .flow { fill: none; stroke: #818b98; stroke-width: 1.5; }
    .loop { fill: none; stroke: #0969da; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .motion { fill: none; stroke: #ffffff; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 3 21; animation: workflow-flow 12s linear infinite; }
    .token { fill: #0969da; opacity: 0; offset-path: path("M260 106 H166 Q158 106 158 114 V912 Q158 920 150 920 H124 Q112 920 112 908 V401 Q112 389 124 389 H150 Q158 389 158 397 V990 Q158 998 166 998"); animation: workflow-token 12s linear infinite; }
    .halo { fill: #0969da; opacity: 0.18; }
    .handover { fill: #818b98; }
    .stop { fill: #bf8700; }
    .block { fill: #cf222e; }
    .head-flow { fill: #818b98; }
    .head-loop { fill: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
    .lede { font-size: 13px; fill: #59636e; }
    .num { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #424a53; text-anchor: middle; }
    .num-key { fill: #ffffff; }
    .num-infra { fill: #8250df; }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: #59636e; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; fill: #59636e; }
    .eyebrow-key { fill: #0969da; }
    .note { font-size: 11.5px; fill: #0969da; }
    .group { font-size: 13px; font-weight: 700; }
    .group-note { font-size: 12px; fill: #59636e; }
    .item { font-size: 12px; fill: #424a53; }
    .label { font-size: 11.5px; font-weight: 600; fill: #0969da; }
    .muted { font-size: 11.5px; fill: #59636e; }
    .out-pass { font-size: 13px; font-weight: 600; fill: #1a7f37; text-anchor: middle; }
    .out-fail { font-size: 13px; font-weight: 600; fill: #d1242f; text-anchor: middle; }
    .start { font-size: 13px; font-weight: 600; text-anchor: middle; }
    @keyframes workflow-flow { to { stroke-dashoffset: -288; } }
    @keyframes workflow-token {
      0% { offset-distance: 0%; opacity: 0; }
      4% { opacity: 1; }
      96% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .stage { fill: #151b23; stroke: #262c36; }
      .stage-key { fill: #0b1d33; stroke: #1f4b7f; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .card-key { fill: #0d1117; stroke: #4493f8; }
      .card-infra { fill: #160f26; stroke: #ab7df8; }
      .exits { fill: #0d1117; stroke: #3d444d; }
      .pill { fill: #0d1117; stroke: #3d444d; }
      .pass { fill: #0f2d1a; stroke: #3fb950; }
      .fail { fill: #3a1418; stroke: #f85149; }
      .chip { fill: #262c36; }
      .chip-key { fill: #4493f8; }
      .chip-infra { stroke: #ab7df8; }
      .spine { stroke: #3d444d; }
      .flow { stroke: #9198a1; }
      .loop { stroke: #4493f8; }
      .motion { stroke: #0d1117; }
      .token, .halo { fill: #4493f8; }
      .handover { fill: #9198a1; }
      .stop { fill: #d29922; }
      .block { fill: #f85149; }
      .head-flow { fill: #9198a1; }
      .head-loop { fill: #4493f8; }
      text { fill: #f0f6fc; }
      .lede, .sub, .eyebrow, .group-note, .muted { fill: #9198a1; }
      .num { fill: #d1d9e0; }
      .num-key { fill: #0d1117; }
      .num-infra { fill: #ab7df8; }
      .eyebrow-key, .note, .label { fill: #4493f8; }
      .item { fill: #d1d9e0; }
      .out-pass { fill: #3fb950; }
      .out-fail { fill: #ff7b72; }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion { animation: none; stroke-dashoffset: 0; opacity: 0; }
      .token { animation: none; opacity: 0; }
    }
  </style>

  <defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-flow" d="M0 1 L9 5 L0 9 z"/></marker>
    <marker id="a-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head-loop" d="M0 1 L9 5 L0 9 z"/></marker>
  </defs>

  <!-- Card, so the diagram reads on any page background. -->
  <rect class="bg" x="1" y="1" width="858" height="1148" rx="16"/>

  <!-- Heading -->
  <text class="h1" x="40" y="48">publish</text>
  <text class="lede" x="40" y="70">From a committed branch to a reviewed change request with green CI and settled feedback.</text>

  <!--
    Layout. Stage panels hold the phase cards: x 170 to 470, one row every 54.
    The blue loop on the left, x 112, carries every fix back to review.
    The exits panel on the right, from x 530, groups the ways a run ends early;
    a coloured dot on a card says that phase has one.
  -->

  <!-- Stage panels -->
  <rect class="stage" x="140" y="136" width="360" height="194" rx="14"/>
  <text class="eyebrow" x="182" y="156">PREPARE</text>
  <rect class="stage stage-key" x="140" y="344" width="360" height="248" rx="14"/>
  <text class="eyebrow eyebrow-key" x="182" y="364">VERIFY</text>
  <text class="note" x="482" y="364" text-anchor="end">every fix comes back here</text>
  <rect class="stage" x="140" y="606" width="360" height="248" rx="14"/>
  <text class="eyebrow" x="182" y="626">SHIP</text>
  <rect class="stage" x="140" y="868" width="360" height="86" rx="14"/>
  <text class="eyebrow" x="182" y="888">SETTLE</text>

  <!-- Spine: one line through every phase, in order. -->
  <rect class="pill" x="260" y="92" width="120" height="28" rx="14"/>
  <text class="start" x="320" y="111">“ship this”</text>
  <path class="spine" d="M320 120 V974"/>
  <path class="flow" d="M320 962 V975" marker-end="url(#a-flow)"/>

  <!-- Phases -->
  <rect class="card" x="170" y="166" width="300" height="44" rx="10"/>
  <rect class="chip" x="182" y="178" width="24" height="20" rx="6"/>
  <text class="num" x="194" y="192">0</text>
  <text class="name" x="218" y="185">Precedence</text>
  <text class="sub" x="218" y="201">is another publish path in charge?</text>
  <circle class="handover" cx="456" cy="180" r="4"/>
  <rect class="card" x="170" y="220" width="300" height="44" rx="10"/>
  <rect class="chip" x="182" y="232" width="24" height="20" rx="6"/>
  <text class="num" x="194" y="246">1</text>
  <text class="name" x="218" y="239">Preflight</text>
  <text class="sub" x="218" y="255">branch, clean tree, forge login, base</text>
  <circle class="stop" cx="456" cy="234" r="4"/>
  <rect class="card" x="170" y="274" width="300" height="44" rx="10"/>
  <rect class="chip" x="182" y="286" width="24" height="20" rx="6"/>
  <text class="num" x="194" y="300">2</text>
  <text class="name" x="218" y="293">Rebase</text>
  <text class="sub" x="218" y="309">onto the freshly fetched base</text>
  <circle class="stop" cx="456" cy="288" r="4"/>
  <rect class="card-key" x="170" y="374" width="300" height="44" rx="10"/>
  <rect class="chip-key" x="182" y="386" width="24" height="20" rx="6"/>
  <text class="num num-key" x="194" y="400">3</text>
  <text class="name" x="218" y="393">Review</text>
  <text class="sub" x="218" y="409">adversarial, rounds until one is clean</text>
  <circle class="block" cx="456" cy="388" r="4"/>
  <rect class="card" x="170" y="428" width="300" height="44" rx="10"/>
  <rect class="chip" x="182" y="440" width="24" height="20" rx="6"/>
  <text class="num" x="194" y="454">4</text>
  <text class="name" x="218" y="447">Gate</text>
  <text class="sub" x="218" y="463">the resolved steps, in order</text>
  <circle class="block" cx="456" cy="442" r="4"/>
  <rect class="card" x="170" y="482" width="300" height="44" rx="10"/>
  <rect class="chip" x="182" y="494" width="24" height="20" rx="6"/>
  <text class="num" x="194" y="508">5</text>
  <text class="name" x="218" y="501">Documentation</text>
  <text class="sub" x="218" y="517">update what went stale, re-run the gate</text>
  <rect class="card" x="170" y="536" width="300" height="44" rx="10"/>
  <rect class="chip" x="182" y="548" width="24" height="20" rx="6"/>
  <text class="num" x="194" y="562">6</text>
  <text class="name" x="218" y="555">Commit</text>
  <text class="sub" x="218" y="571">review and gate fixes, separately</text>
  <rect class="card" x="170" y="636" width="300" height="44" rx="10"/>
  <rect class="chip" x="182" y="648" width="24" height="20" rx="6"/>
  <text class="num" x="194" y="662">7</text>
  <text class="name" x="218" y="655">Push</text>
  <text class="sub" x="218" y="671">--force-with-lease, keep the head</text>
  <rect class="card" x="170" y="690" width="300" height="44" rx="10"/>
  <rect class="chip" x="182" y="702" width="24" height="20" rx="6"/>
  <text class="num" x="194" y="716">8</text>
  <text class="name" x="218" y="709">Change request</text>
  <text class="sub" x="218" y="725">four headings, visual evidence</text>
  <circle class="block" cx="456" cy="704" r="4"/>
  <rect class="card" x="170" y="744" width="300" height="44" rx="10"/>
  <rect class="chip" x="182" y="756" width="24" height="20" rx="6"/>
  <text class="num" x="194" y="770">9</text>
  <text class="name" x="218" y="763">CI</text>
  <text class="sub" x="218" y="779">red or still running is not done</text>
  <circle class="block" cx="456" cy="758" r="4"/>
  <rect class="card-infra" x="170" y="798" width="300" height="44" rx="10"/>
  <rect class="chip-infra" x="182" y="810" width="24" height="20" rx="6"/>
  <text class="num num-infra" x="194" y="824">+</text>
  <text class="name" x="218" y="817">Infrastructure plan review</text>
  <text class="sub" x="218" y="833">only when infrastructure is affected</text>
  <circle class="block" cx="456" cy="812" r="4"/>
  <rect class="card" x="170" y="898" width="300" height="44" rx="10"/>
  <rect class="chip" x="182" y="910" width="30" height="20" rx="6"/>
  <text class="num" x="197" y="924">10</text>
  <text class="name" x="224" y="917">Feedback</text>
  <text class="sub" x="224" y="933">answer and resolve every thread</text>
  <circle class="block" cx="456" cy="912" r="4"/>

  <!-- Report and its two verdicts -->
  <rect class="card" x="170" y="976" width="300" height="44" rx="10"/>
  <text class="name" x="186" y="995">Report</text>
  <text class="sub" x="186" y="1011">the verdict at the checked head</text>
  <path class="flow" d="M320 1020 V1032 M320 1032 H244 V1044 M320 1032 H396 V1044"/>
  <rect class="pass" x="170" y="1046" width="144" height="30" rx="15"/>
  <text class="out-pass" x="242" y="1066">passed</text>
  <rect class="fail" x="326" y="1046" width="144" height="30" rx="15"/>
  <text class="out-fail" x="398" y="1066">blocked: not done</text>
  <text class="muted" x="242" y="1094" text-anchor="middle">every step passed or n/a</text>
  <text class="muted" x="398" y="1094" text-anchor="middle">anything failed or skipped</text>

  <!-- The fix loop: every fix is new code, so it goes back to review. -->
  <g class="loop">
    <path d="M170 920 H124 Q112 920 112 908 V401 Q112 389 124 389 H166" marker-end="url(#a-loop)"/>
    <path d="M170 450 H124 Q112 450 112 438"/>
    <path d="M170 766 H124 Q112 766 112 754"/>
    <path d="M170 405 H124 Q112 405 112 393"/>
  </g>
  <path class="motion" d="M170 920 H124 Q112 920 112 908 V401 Q112 389 124 389 H162"/>
  <text class="label" x="102" y="409" text-anchor="end">findings</text>
  <text class="label" x="102" y="454" text-anchor="end">gate fails</text>
  <text class="label" x="102" y="770" text-anchor="end">CI red</text>
  <text class="label" x="102" y="924" text-anchor="end">fixes</text>

  <!-- Changed documentation re-runs the gate. -->
  <path class="flow" d="M470 504 H476 Q486 504 486 494 V460 Q486 450 476 450 H473" marker-end="url(#a-flow)"/>

  <!-- Exits: the ways a run ends early, by phase. -->
  <rect class="exits" x="530" y="136" width="300" height="498" rx="14"/>
  <text class="eyebrow" x="548" y="156">EXITS</text>
  <circle class="handover" cx="554" cy="172" r="5"/>
  <text class="group" x="568" y="176">Hand over <tspan class="group-note">and stop</tspan></text>
  <rect class="chip" x="554" y="190" width="24" height="20" rx="6"/>
  <text class="num" x="566" y="204">0</text>
  <text class="item" x="596" y="204">another publish skill, gate tool or</text>
  <text class="item" x="596" y="220">agent rule owns publishing</text>
  <circle class="stop" cx="554" cy="252" r="5"/>
  <text class="group" x="568" y="256">Stop <tspan class="group-note">and say why; the user decides</tspan></text>
  <rect class="chip" x="554" y="270" width="24" height="20" rx="6"/>
  <text class="num" x="566" y="284">1</text>
  <text class="item" x="596" y="284">the base branch, a dirty tree, no</text>
  <text class="item" x="596" y="300">forge adapter or no forge login</text>
  <rect class="chip" x="554" y="316" width="24" height="20" rx="6"/>
  <text class="num" x="566" y="330">2</text>
  <text class="item" x="596" y="330">a rebase conflict, paths named</text>
  <circle class="block" cx="554" cy="362" r="5"/>
  <text class="group" x="568" y="366">Block <tspan class="group-note">reported as not done</tspan></text>
  <rect class="chip" x="554" y="380" width="24" height="20" rx="6"/>
  <text class="num" x="566" y="394">3</text>
  <text class="item" x="596" y="394">still finding defects at round 5;</text>
  <text class="item" x="596" y="410">nothing is pushed</text>
  <rect class="chip" x="554" y="426" width="24" height="20" rx="6"/>
  <text class="num" x="566" y="440">4</text>
  <text class="item" x="596" y="440">a required gate step cannot run</text>
  <rect class="chip" x="554" y="456" width="24" height="20" rx="6"/>
  <text class="num" x="566" y="470">8</text>
  <text class="item" x="596" y="470">a frontend change with no visual</text>
  <text class="item" x="596" y="486">evidence or disclosure</text>
  <rect class="chip" x="554" y="502" width="24" height="20" rx="6"/>
  <text class="num" x="566" y="516">9</text>
  <text class="item" x="596" y="516">CI still running past its timeout</text>
  <rect class="chip-infra" x="554" y="532" width="24" height="20" rx="6"/>
  <text class="num num-infra" x="566" y="546">+</text>
  <text class="item" x="596" y="546">missing, partial or stale plan</text>
  <text class="item" x="596" y="562">evidence; nothing is applied</text>
  <rect class="chip" x="554" y="578" width="30" height="20" rx="6"/>
  <text class="num" x="569" y="592">10</text>
  <text class="item" x="596" y="592">a point still raised after two</text>
  <text class="item" x="596" y="608">rounds, or new findings on a third pass</text>

  <!-- Travelling token: one pass with a fix, invisible unless animated. -->
  <g class="token"><circle class="halo" r="9"/><circle r="4.5"/></g>

  <!-- Legend -->
  <g transform="translate(40 1116)">
    <path class="flow" d="M0 0 H26" marker-end="url(#a-flow)"/>
    <text class="muted" x="34" y="4">next phase</text>
    <path class="loop" d="M118 0 H144" marker-end="url(#a-loop)"/>
    <text class="muted" x="152" y="4">fix, back to review</text>
    <rect class="chip-infra" x="282" y="-10" width="24" height="20" rx="6"/>
    <text class="num num-infra" x="294" y="4">+</text>
    <text class="muted" x="314" y="4">only when infrastructure is affected</text>
    <circle class="handover" cx="550" cy="0" r="4"/>
    <circle class="stop" cx="562" cy="0" r="4"/>
    <circle class="block" cx="574" cy="0" r="4"/>
    <text class="muted" x="586" y="4">this phase has an exit</text>
  </g>
</svg>
